name: ACEest CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Build Docker image
        run: docker build -t aceest-fitness .
      - name: Check syntax and test inside the image
        run: docker run --rm aceest-fitness sh -c "python -m compileall -q app.py tests && pytest -q"
